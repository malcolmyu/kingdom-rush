<body>
<main id="game" aria-label="王国保卫战：起源">
 <div id="screen" class="screen"></div>
 <canvas id="battlefield" width="1672" height="1014" aria-label="战场，点击建造点建塔，选择技能后点击道路施放" hidden></canvas>
 <div id="battle-ui" hidden>
  <div id="battle-slots" aria-label="建造点和魔法花"></div>
  <div id="hud" aria-label="战斗状态"><canvas width="224" height="76" data-icon="hud_background"></canvas><b id="lives">20</b><b id="gold">320</b><b id="wave">0 / 6</b></div>
  <span id="battle-name"></span>
  <div class="top-actions"><button id="battle-sound" class="small-button" aria-label="切换声音">♪</button><button id="speed" class="small-button" aria-label="切换游戏速度">1×</button><button id="pause" class="native-pause" aria-label="暂停游戏"><canvas width="112" height="112"></canvas></button></div>
  <div id="guidance" aria-live="polite"></div>
  <div id="build-menu" class="build-menu" hidden></div>
  <div class="abilities">
   <button id="hero" class="ability hero" aria-label="选择艾瑞丹"><canvas width="84" height="92"></canvas><span class="key">H</span><span class="ability-note"></span></button>
   <button id="lightning" class="ability" aria-label="选择雷电"><canvas width="100" height="100"></canvas><span class="key">1</span><span class="ability-note"></span></button>
   <button id="reinforce" class="ability" aria-label="选择援军"><canvas width="100" height="100"></canvas><span class="key">2</span><span class="ability-note"></span></button>
   <button id="arrows" class="ability" aria-label="选择箭雨"><canvas width="100" height="100"></canvas><span class="key">3</span><span class="ability-note"></span></button>
  </div>
  <div id="incoming-wave" role="status" hidden></div><div id="wave-entrances"><button id="next" class="wave-entrance" aria-label="开始战斗"><canvas width="120" height="120"></canvas></button></div>
  <button id="battle-back" class="battle-exit" aria-label="战斗菜单">☰</button>
 </div>
 <div id="toast" role="status" hidden></div>
 <div id="veil" class="veil" hidden><section id="dialog" class="parchment" role="dialog" aria-modal="true" aria-labelledby="dialog-title"></section></div>
 <div id="loading" class="loading"><div class="loading-emblem">🏹</div><p id="loading-text">正在进入精灵的家园…</p></div>
</main>
